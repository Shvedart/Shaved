<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D Карусель — Сборщик</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{
  background:#08080f;
  color:#e0e0e0;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  min-height:100vh;
}

/* ── Builder layout ── */
#builder{
  max-width:960px;
  margin:0 auto;
  padding:28px 20px 60px;
  display:grid;
  grid-template-columns:1fr 420px;
  gap:32px;
  align-items:start;
}
@media(max-width:820px){#builder{grid-template-columns:1fr;}}

.builder-left{}
.builder-right{position:sticky;top:20px;}

h1{font-size:22px;font-weight:700;margin-bottom:4px;}
.subtitle{font-size:13px;color:#555;margin-bottom:20px;}

/* Drop zone */
#drop-zone{
  border:2px dashed #252535;
  border-radius:16px;
  padding:28px 20px;
  text-align:center;
  cursor:pointer;
  transition:border-color .2s,background .2s;
  margin-bottom:20px;
}
#drop-zone.drag-over{border-color:#5b8cff;background:#10152a;}
#dz-icon{font-size:32px;margin-bottom:8px;}
#dz-text{font-size:14px;color:#555;}
#file-input{display:none;}

/* Card list */
#card-list{display:flex;flex-direction:column;gap:8px;margin-bottom:20px;}
.card-item{
  background:#111120;
  border:1px solid #1e1e2e;
  border-radius:12px;
  padding:10px 14px;
  display:flex;
  align-items:center;
  gap:12px;
  user-select:none;
}
.drag-handle{color:#333;cursor:grab;font-size:18px;flex-shrink:0;}
.drag-handle:active{cursor:grabbing;}
.card-thumb{
  width:38px;height:56px;
  border-radius:6px;
  object-fit:cover;
  background:#1a1a2a;
  flex-shrink:0;
}
.card-info{flex:1;min-width:0;}
.ci-title{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ci-meta{font-size:12px;color:#555;margin-top:2px;}
.btn-remove{
  width:28px;height:28px;flex-shrink:0;
  border:none;border-radius:8px;
  background:#1e1010;color:#c44;
  font-size:15px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:background .15s;
}
.btn-remove:hover{background:#2a1010;}
.card-item.drag-over-top{border-top:2px solid #5b8cff;}
.card-item.drag-over-bot{border-bottom:2px solid #5b8cff;}

/* Actions */
.actions{display:flex;gap:10px;flex-wrap:wrap;}
.btn-export{
  padding:10px 24px;
  background:#1a2a1a;
  border:1px solid #3a7a3a88;
  border-radius:10px;
  color:#6abf6a;
  font-size:14px;font-weight:600;
  cursor:pointer;
  transition:background .2s;
}
.btn-export:hover{background:#1e361e;}
.btn-export:disabled{background:#141414;color:#444;border-color:#222;cursor:default;}

/* ── Phone preview ── */
.preview-label{font-size:12px;color:#444;text-align:center;margin-bottom:12px;letter-spacing:.05em;text-transform:uppercase;}
.phone-frame{
  width:390px;height:700px;
  margin:0 auto;
  background:#111;
  border-radius:50px;
  border:8px solid #222;
  box-shadow:0 24px 64px #000c,inset 0 0 0 1px #333;
  overflow:hidden;
  position:relative;
}
/* notch */
.phone-frame::before{
  content:'';
  position:absolute;
  top:12px;left:50%;transform:translateX(-50%);
  width:100px;height:30px;
  background:#111;
  border-radius:0 0 16px 16px;
  z-index:10;
}
.phone-inner{
  width:100%;height:100%;
  border-radius:42px;
  overflow:hidden;
  background:#0d0d14;
}

/* ── Carousel ── */
.carousel-scroll{
  width:100%;height:100%;
  overflow-x:scroll;overflow-y:hidden;
  scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch;
  display:flex;
  align-items:center;
  padding:0 65px;
  gap:14px;
  scrollbar-width:none;
}
.carousel-scroll::-webkit-scrollbar{display:none;}

/* Card */
.card-3d{
  flex-shrink:0;
  width:260px;
  scroll-snap-align:center;
  transition:transform .25s ease, opacity .25s ease;
  will-change:transform,opacity;
}
.card-canvas-wrap{
  width:260px;height:380px;
  border-radius:20px;
  overflow:hidden;
  position:relative;
  background:#1a1a2a;
  box-shadow:0 8px 32px #0008;
}
.card-canvas-wrap canvas{width:100%;height:100%;display:block;}
.tag-genre{
  position:absolute;top:12px;left:12px;
  background:rgba(255,255,255,.16);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-radius:20px;padding:4px 12px;
  font-size:11px;font-weight:700;color:#fff;
  letter-spacing:.02em;
}
.tag-rating{
  position:absolute;bottom:12px;left:12px;
  background:#fff;border-radius:20px;
  padding:4px 10px;
  font-size:11px;font-weight:700;color:#111;
  display:flex;align-items:center;gap:5px;
}
.rating-dot{width:7px;height:7px;border-radius:50%;background:#22cc55;}
.card-meta-below{padding:10px 4px 0;}
.card-meta-title{font-size:15px;font-weight:700;color:#f0f0f0;margin-bottom:2px;}
.card-meta-sub{font-size:12px;color:#555;}

/* Empty state */
#empty-state{
  width:100%;text-align:center;
  padding:0 20px;
  color:#333;font-size:13px;line-height:1.6;
  flex-shrink:0;
}
</style>
</head>
<body>

<div id="builder">

  <!-- LEFT: controls -->
  <div class="builder-left">
    <h1>3D Карусель</h1>
    <p class="subtitle">Экспортируйте карточки из depth3d.html и загрузите сюда</p>

    <div id="drop-zone">
      <input type="file" id="file-input" accept=".html" multiple>
      <div id="dz-icon">🎬</div>
      <div id="dz-text">Перетащите card.html файлы или нажмите для выбора<br><span style="color:#333;font-size:12px">Можно несколько сразу</span></div>
    </div>

    <div id="card-list"></div>

    <!-- Настройки карусели -->
    <div style="background:#111120;border:1px solid #1e1e2e;border-radius:12px;padding:12px 16px;margin-bottom:16px;">
      <div style="font-size:11px;color:#555;letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px;">Настройки карусели</div>
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">
        <label style="font-size:13px;color:#888;white-space:nowrap;min-width:110px;">Поворот при скролле</label>
        <input type="range" id="sl-maxdeg" min="0" max="60" step="1" value="35" style="flex:1;accent-color:#5b8cff;">
        <span id="v-maxdeg" style="font-size:13px;color:#aaa;min-width:34px;text-align:right;">35°</span>
      </div>
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">
        <label style="font-size:13px;color:#888;white-space:nowrap;min-width:110px;">Блюр боковых</label>
        <input type="range" id="sl-blur" min="0" max="20" step="0.5" value="0" style="flex:1;accent-color:#5b8cff;">
        <span id="v-blur" style="font-size:13px;color:#aaa;min-width:34px;text-align:right;">0px</span>
      </div>
      <div style="display:flex;align-items:center;gap:10px;">
        <label style="font-size:13px;color:#888;white-space:nowrap;min-width:110px;">Зум центральной</label>
        <button id="tog-scale" style="
          padding:4px 14px;border-radius:20px;border:1px solid #3a5a9a88;
          background:#1a2a3a;color:#6aaabf;font-size:12px;cursor:pointer;
          transition:background .15s,color .15s;
        ">Вкл</button>
      </div>
    </div>

    <div class="actions">
      <button class="btn-export" id="export-btn" disabled>⬇ Экспорт карусели HTML</button>
    </div>
  </div>

  <!-- RIGHT: phone preview -->
  <div class="builder-right">
    <div class="preview-label">Предпросмотр</div>
    <div class="phone-frame">
      <div class="phone-inner">
        <div class="carousel-scroll" id="carousel">
          <div id="empty-state">Загрузите карточки<br>чтобы увидеть карусель</div>
        </div>
      </div>
    </div>
  </div>

</div>

<script>
// ═══════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════
const cards   = [];   // [{color, depth, cfg, meta}]
const glCtrl  = [];   // per-card WebGL controller

// ═══════════════════════════════════════════════════
//  PARSE CARD HTML
// ═══════════════════════════════════════════════════
function parseCardHTML(html) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const el  = doc.getElementById('card-data');
  if (!el) return null;
  try { return JSON.parse(el.textContent); } catch { return null; }
}

// ═══════════════════════════════════════════════════
//  FILE LOADING
// ═══════════════════════════════════════════════════
function loadFiles(files) {
  [...files].forEach(file => {
    if (!file.name.endsWith('.html')) return;
    const r = new FileReader();
    r.onload = e => {
      const data = parseCardHTML(e.target.result);
      if (!data) { alert(`${file.name}: не найден блок card-data.\nЭкспортируйте через кнопку "Экспорт карточки" в depth3d.html`); return; }
      cards.push(data);
      renderBuilder();
      renderCarousel();
    };
    r.readAsText(file);
  });
}

const dz = document.getElementById('drop-zone');
const fi = document.getElementById('file-input');
dz.addEventListener('click', () => fi.click());
fi.addEventListener('change', e => loadFiles(e.target.files));
dz.addEventListener('dragover',  e => { e.preventDefault(); dz.classList.add('drag-over'); });
dz.addEventListener('dragleave', () => dz.classList.remove('drag-over'));
dz.addEventListener('drop', e => { e.preventDefault(); dz.classList.remove('drag-over'); loadFiles(e.dataTransfer.files); });

// ═══════════════════════════════════════════════════
//  BUILDER LIST
// ═══════════════════════════════════════════════════
function renderBuilder() {
  const list = document.getElementById('card-list');
  list.innerHTML = cards.map((c, i) => `
    <div class="card-item" draggable="true" data-index="${i}">
      <span class="drag-handle">⠿</span>
      <img class="card-thumb" src="${c.color}" alt="">
      <div class="card-info">
        <div class="ci-title">${c.meta?.title || 'Без названия'}</div>
        <div class="ci-meta">${[c.meta?.year, c.meta?.genre].filter(Boolean).join(' · ') || '—'}</div>
      </div>
      <button class="btn-remove" data-remove="${i}">✕</button>
    </div>
  `).join('');
  document.getElementById('export-btn').disabled = cards.length === 0;
  initDragDrop(list);
}

// ── Удаление через делегирование ──────────────────────────────────────────────
document.getElementById('card-list').addEventListener('click', e => {
  const btn = e.target.closest('[data-remove]');
  if (!btn) return;
  removeCard(+btn.dataset.remove);
});

// ── Drag-and-drop сортировка ──────────────────────────────────────────────────
function initDragDrop(list) {
  let dragIdx = null;

  list.addEventListener('dragstart', e => {
    const item = e.target.closest('.card-item');
    if (!item) return;
    dragIdx = +item.dataset.index;
    item.style.opacity = '0.4';
    e.dataTransfer.effectAllowed = 'move';
  });

  list.addEventListener('dragend', e => {
    const item = e.target.closest('.card-item');
    if (item) item.style.opacity = '';
    list.querySelectorAll('.card-item').forEach(el => el.classList.remove('drag-over-top','drag-over-bot'));
  });

  list.addEventListener('dragover', e => {
    e.preventDefault();
    const item = e.target.closest('.card-item');
    if (!item) return;
    list.querySelectorAll('.card-item').forEach(el => el.classList.remove('drag-over-top','drag-over-bot'));
    const rect = item.getBoundingClientRect();
    const mid  = rect.top + rect.height / 2;
    item.classList.add(e.clientY < mid ? 'drag-over-top' : 'drag-over-bot');
  });

  list.addEventListener('drop', e => {
    e.preventDefault();
    const item = e.target.closest('.card-item');
    if (!item || dragIdx === null) return;
    const dropIdx = +item.dataset.index;
    if (dropIdx === dragIdx) return;

    const rect = item.getBoundingClientRect();
    const after = e.clientY >= rect.top + rect.height / 2;
    const insertAt = after ? dropIdx + 1 : dropIdx;

    const moved = cards.splice(dragIdx, 1)[0];
    const realInsert = insertAt > dragIdx ? insertAt - 1 : insertAt;
    cards.splice(realInsert, 0, moved);

    dragIdx = null;
    renderBuilder();
    renderCarousel();
  });
}

function removeCard(i) {
  cards.splice(i, 1);
  renderBuilder();
  renderCarousel();
}

// ═══════════════════════════════════════════════════
//  WEBGL HELPERS
// ═══════════════════════════════════════════════════
const VS = `#version 300 es
precision highp float;
in vec2 a_uv;
uniform sampler2D u_depth;
uniform sampler2D u_color;
uniform mat4 u_mvp;
uniform float u_disp;
uniform vec2 u_shift;
uniform float u_aspect;
uniform vec2 u_offset;
uniform float u_edge_shrink;
out vec2 v_uv;
void main(){
  v_uv = a_uv;
  float d = texture(u_depth, a_uv).r;
  float a0 = texture(u_color, a_uv).a;
  if (u_edge_shrink > 0.0) {
    float e = u_edge_shrink;
    float d1 = texture(u_depth, a_uv + vec2( e, 0.0)).r;
    float d2 = texture(u_depth, a_uv + vec2(-e, 0.0)).r;
    float d3 = texture(u_depth, a_uv + vec2(0.0,  e)).r;
    float d4 = texture(u_depth, a_uv + vec2(0.0, -e)).r;
    float a1 = texture(u_color, a_uv + vec2( e, 0.0)).a;
    float a2 = texture(u_color, a_uv + vec2(-e, 0.0)).a;
    float a3 = texture(u_color, a_uv + vec2(0.0,  e)).a;
    float a4 = texture(u_color, a_uv + vec2(0.0, -e)).a;
    if (a0 < 0.5) {
      float maxD = 0.0;
      if (a1 >= 0.5) maxD = max(maxD, d1);
      if (a2 >= 0.5) maxD = max(maxD, d2);
      if (a3 >= 0.5) maxD = max(maxD, d3);
      if (a4 >= 0.5) maxD = max(maxD, d4);
      d = maxD;
    }
  } else {
    if (a0 < 0.5) d = 0.0;
  }
  float x = ((a_uv.x*2.0-1.0) + u_shift.x*(1.0-d)) * u_aspect + u_offset.x;
  float y = -(a_uv.y*2.0-1.0) + u_shift.y*(1.0-d) + u_offset.y;
  float z = d * u_disp;
  gl_Position = u_mvp * vec4(x,y,z,1.0);
}`;

const FS = `#version 300 es
precision highp float;
in vec2 v_uv;
uniform sampler2D u_color;
out vec4 f;
void main(){
  vec4 col = texture(u_color, v_uv);
  if (col.a < 0.5) discard;
  f = col;
}`;

function compileGL(gl, type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s); return s;
}

function makeTex(gl, img) {
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
  gl.generateMipmap(gl.TEXTURE_2D);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return t;
}

/* column-major mat4 */
function persp(fov, asp, n, f) {
  const t = 1/Math.tan(fov/2), d = f-n;
  return new Float32Array([t/asp,0,0,0, 0,t,0,0, 0,0,-(f+n)/d,-1, 0,0,-2*f*n/d,0]);
}
function rotX(a){const c=Math.cos(a),s=Math.sin(a);return new Float32Array([1,0,0,0,0,c,s,0,0,-s,c,0,0,0,0,1]);}
function rotY(a){const c=Math.cos(a),s=Math.sin(a);return new Float32Array([c,0,-s,0,0,1,0,0,s,0,c,0,0,0,0,1]);}
function transl(x,y,z){const m=new Float32Array(16);m[0]=m[5]=m[10]=m[15]=1;m[12]=x;m[13]=y;m[14]=z;return m;}
function mul(a,b){
  const o=new Float32Array(16);
  for(let c=0;c<4;c++) for(let r=0;r<4;r++)
    o[c*4+r]=a[r]*b[c*4]+a[4+r]*b[c*4+1]+a[8+r]*b[c*4+2]+a[12+r]*b[c*4+3];
  return o;
}
function lerpFn(cur,tgt,base,dt){ return cur+(tgt-cur)*(1-Math.pow(1-base,dt/16.667)); }

// ═══════════════════════════════════════════════════
//  CREATE WEBGL CARD CONTROLLER
//  setAngle(ry) — вызывается скроллом напрямую
// ═══════════════════════════════════════════════════
function createGLCard(canvas, colorSrc, depthSrc, cfg) {
  const gl = canvas.getContext('webgl2', { alpha: true, premultipliedAlpha: false });
  if (!gl) return null;

  const prog = gl.createProgram();
  gl.attachShader(prog, compileGL(gl, gl.VERTEX_SHADER,   VS));
  gl.attachShader(prog, compileGL(gl, gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(prog); gl.useProgram(prog);
  gl.enable(gl.DEPTH_TEST);
  gl.clearColor(0, 0, 0, 0);

  const uMvp    = gl.getUniformLocation(prog,'u_mvp');
  const uDisp       = gl.getUniformLocation(prog,'u_disp');
  const uShift      = gl.getUniformLocation(prog,'u_shift');
  const uAspect     = gl.getUniformLocation(prog,'u_aspect');
  const uOffset     = gl.getUniformLocation(prog,'u_offset');
  const uEdgeShrink = gl.getUniformLocation(prog,'u_edge_shrink');
  gl.uniform1i(gl.getUniformLocation(prog,'u_depth'), 0);
  gl.uniform1i(gl.getUniformLocation(prog,'u_color'), 1);
  gl.uniform1f(uEdgeShrink, cfg.edge || 0);

  /* mesh */
  const N = Math.min(cfg.grid || 200, 250);
  const verts = new Float32Array((N+1)*(N+1)*2);
  let vi=0;
  for(let y=0;y<=N;y++) for(let x=0;x<=N;x++){verts[vi++]=x/N;verts[vi++]=y/N;}
  const ids = new Uint32Array(N*N*6); let ii=0;
  for(let y=0;y<N;y++) for(let x=0;x<N;x++){
    const tl=y*(N+1)+x;
    ids[ii++]=tl;ids[ii++]=tl+1;ids[ii++]=tl+N+1;
    ids[ii++]=tl+1;ids[ii++]=tl+N+2;ids[ii++]=tl+N+1;
  }
  const vbo=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,vbo); gl.bufferData(gl.ARRAY_BUFFER,verts,gl.STATIC_DRAW);
  const ibo=gl.createBuffer(); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ibo); gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,ids,gl.STATIC_DRAW);
  const loc=gl.getAttribLocation(prog,'a_uv');

  /* textures */
  let texColor=null, texDepth=null, loaded=0;
  const imgC=new Image(); imgC.onload=()=>{texColor=makeTex(gl,imgC);if(++loaded===2)drawFrame(curRY);}; imgC.src=colorSrc;
  const imgD=new Image(); imgD.onload=()=>{texDepth=makeTex(gl,imgD);if(++loaded===2)drawFrame(curRY);}; imgD.src=depthSrc;

  /* config */
  const fov       = (cfg.fov||55)*Math.PI/180;
  const dist      = cfg.dist||2.2;
  const disp      = cfg.depth||0.4;
  const offx      = cfg.offx||0;
  const offy      = cfg.offy||0;
  const imgAspect = cfg.imgW&&cfg.imgH ? cfg.imgW/cfg.imgH : 1;

  /* scroll-driven state */
  let curRY = 0;   // текущий угол (плавный, следует за скроллом)
  let tgtRY = 0;   // целевой угол (задаётся скроллом напрямую)
  let raf = null;

  function drawFrame(ry) {
    if (loaded<2) return;
    const cW=canvas.width, cH=canvas.height, asp=cW/cH;
    const mvp=mul(mul(persp(fov,asp,.01,100),transl(0,0,-dist)),mul(rotX(0),rotY(ry)));
    gl.viewport(0,0,cW,cH);
    gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
    gl.uniformMatrix4fv(uMvp,false,mvp);
    gl.uniform1f(uDisp,disp);
    gl.uniform2f(uShift,0,0);
    gl.uniform1f(uAspect,imgAspect);
    gl.uniform2f(uOffset,offx,offy);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,texDepth);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D,texColor);
    gl.bindBuffer(gl.ARRAY_BUFFER,vbo);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ibo);
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc,2,gl.FLOAT,false,8,0);
    gl.drawElements(gl.TRIANGLES,ids.length,gl.UNSIGNED_INT,0);
  }

  /* плавный lerp к целевому углу */
  let lastTs = 0;
  function smoothLoop(ts) {
    const dt = Math.min(ts-lastTs, 100); lastTs=ts;
    curRY = lerpFn(curRY, tgtRY, 0.12, dt);
    drawFrame(curRY * Math.PI/180);
    if (Math.abs(curRY - tgtRY) > 0.05) {
      raf = requestAnimationFrame(smoothLoop);
    } else {
      curRY = tgtRY;
      drawFrame(curRY * Math.PI/180);
      raf = null;
    }
  }

  function scheduleRender() {
    if (raf) return;
    lastTs = performance.now();
    raf = requestAnimationFrame(smoothLoop);
  }

  return {
    // offset: -1 = далеко слева, 0 = центр, +1 = далеко справа
    // maxDeg: максимальный угол поворота в градусах
    setOffset(offset, maxDeg = 35) {
      tgtRY = Math.max(-maxDeg, Math.min(maxDeg, -offset * maxDeg));
      scheduleRender();
    }
  };
}

// ═══════════════════════════════════════════════════
//  RENDER CAROUSEL
// ═══════════════════════════════════════════════════
function renderCarousel() {
  glCtrl.length = 0;

  const carousel = document.getElementById('carousel');
  carousel.innerHTML = '';

  if (cards.length === 0) {
    carousel.innerHTML = '<div id="empty-state">Загрузите карточки<br>чтобы увидеть карусель</div>';
    return;
  }

  cards.forEach((card, i) => {
    const el = document.createElement('div');
    el.className = 'card-3d';
    el.innerHTML = `
      <div class="card-canvas-wrap" style="${card.bg ? `background-image:url('${card.bg}');background-size:cover;background-position:center;` : ''}">
        <canvas width="520" height="760" style="position:relative;z-index:1;"></canvas>
        ${card.fg ? `<img src="${card.fg}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;z-index:2;pointer-events:none;">` : ''}
        ${card.meta?.genre  ? `<div class="tag-genre">${card.meta.genre}</div>` : ''}
        ${card.meta?.rating ? `<div class="tag-rating"><div class="rating-dot"></div>${card.meta.rating}</div>` : ''}
      </div>
      <div class="card-meta-below">
        <div class="card-meta-title">${card.meta?.title||''}</div>
        <div class="card-meta-sub">${[card.meta?.year,card.meta?.country].filter(Boolean).join(', ')}</div>
      </div>`;
    carousel.appendChild(el);

    const canvas = el.querySelector('canvas');
    const ctrl = createGLCard(canvas, card.color, card.depth, card.cfg);
    glCtrl.push(ctrl);
  });

  setupScrollDriven();
}

// ═══════════════════════════════════════════════════
//  SCROLL → УГОЛ КАЖДОЙ КАРТОЧКИ
//  offset = (центр карточки - центр вьюпорта) / ширина карточки
//  offset=0 → прямо, offset=-1 → далеко слева, offset=+1 → далеко справа
// ═══════════════════════════════════════════════════
function setupScrollDriven() {
  const carousel = document.getElementById('carousel');
  const slMaxDeg  = document.getElementById('sl-maxdeg');
  const vMaxDeg   = document.getElementById('v-maxdeg');
  const slBlur    = document.getElementById('sl-blur');
  const vBlur     = document.getElementById('v-blur');
  const togScale  = document.getElementById('tog-scale');
  let scaleOn = true;

  togScale.addEventListener('click', () => {
    scaleOn = !scaleOn;
    togScale.textContent = scaleOn ? 'Вкл' : 'Выкл';
    togScale.style.background = scaleOn ? '#1a2a3a' : '#1a1a1a';
    togScale.style.color      = scaleOn ? '#6aaabf' : '#555';
    updateAngles();
  });

  function updateAngles() {
    const maxDeg  = +slMaxDeg.value;
    const maxBlur = +slBlur.value;
    const viewCx  = carousel.scrollLeft + carousel.clientWidth / 2;
    const cardEls = [...carousel.querySelectorAll('.card-3d')];
    cardEls.forEach((el, i) => {
      const cardCx   = el.offsetLeft + el.offsetWidth / 2;
      const offset   = (cardCx - viewCx) / el.offsetWidth;
      const clamped  = Math.max(-1.5, Math.min(1.5, offset));
      const proximity = Math.max(0, 1 - Math.abs(clamped) * 0.5);
      const scale    = scaleOn ? 0.88 + proximity * 0.12 : 1;
      el.style.transform = `scale(${scale})`;
      el.style.opacity   = 0.45 + proximity * 0.55;
      const blurPx = maxBlur * (1 - proximity);
      el.querySelector('canvas').style.filter = blurPx > 0.1 ? `blur(${blurPx.toFixed(1)}px)` : '';
      glCtrl[i] && glCtrl[i].setOffset(clamped, maxDeg);
    });
  }

  slMaxDeg.addEventListener('input', () => { vMaxDeg.textContent = slMaxDeg.value + '°'; updateAngles(); });
  slBlur.addEventListener('input',   () => { vBlur.textContent   = slBlur.value + 'px'; updateAngles(); });

  carousel.addEventListener('scroll', updateAngles, { passive: true });
  setTimeout(updateAngles, 150);
}

// ═══════════════════════════════════════════════════
//  EXPORT
// ═══════════════════════════════════════════════════
document.getElementById('export-btn').addEventListener('click', () => {
  const html = buildExportHTML();
  const blob = new Blob([html], { type: 'text/html' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'carousel-3d.html';
  a.click();
  URL.revokeObjectURL(a.href);
});

function buildExportHTML() {
  const maxDeg  = +document.getElementById('sl-maxdeg').value;
  const maxBlur = +document.getElementById('sl-blur').value;
  const useScale = scaleOn;
  const cardsData = JSON.stringify(cards.map(c => ({color:c.color,depth:c.depth,cfg:c.cfg,meta:c.meta,bg:c.bg||null,fg:c.fg||null})));

  return `<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>3D Карусель</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;background:#0d0d14;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}
body{display:flex;align-items:center;justify-content:center;}
.carousel-scroll{
  width:100vw;height:100vh;
  overflow-x:scroll;overflow-y:hidden;
  scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch;
  display:flex;align-items:center;
  padding:0 calc(50vw - 130px);
  gap:14px;
  scrollbar-width:none;
}
.carousel-scroll::-webkit-scrollbar{display:none;}
.card-3d{
  flex-shrink:0;width:260px;
  scroll-snap-align:center;
  transition:transform .25s ease,opacity .25s ease;
  will-change:transform,opacity;
}
.card-canvas-wrap{
  width:260px;height:380px;
  border-radius:20px;overflow:hidden;
  position:relative;background:#1a1a2a;
  box-shadow:0 12px 40px #0009;
}
.card-canvas-wrap canvas{width:100%;height:100%;display:block;}
.tag-genre{
  position:absolute;top:12px;left:12px;
  background:rgba(255,255,255,.16);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-radius:20px;padding:4px 12px;
  font-size:11px;font-weight:700;color:#fff;
}
.tag-rating{
  position:absolute;bottom:12px;left:12px;
  background:#fff;border-radius:20px;padding:4px 10px;
  font-size:11px;font-weight:700;color:#111;
  display:flex;align-items:center;gap:5px;
}
.rating-dot{width:7px;height:7px;border-radius:50%;background:#22cc55;}
.card-meta-below{padding:10px 4px 0;}
.card-meta-title{font-size:15px;font-weight:700;color:#f0f0f0;margin-bottom:2px;}
.card-meta-sub{font-size:12px;color:#555;}
</style>
</head>
<body>
<div class="carousel-scroll" id="carousel"></div>
<script>
const CARDS=${cardsData};

const VS=\`#version 300 es
precision highp float;
in vec2 a_uv;
uniform sampler2D u_depth;
uniform sampler2D u_color;
uniform mat4 u_mvp;
uniform float u_disp;
uniform vec2 u_shift;
uniform float u_aspect;
uniform vec2 u_offset;
uniform float u_edge_shrink;
out vec2 v_uv;
void main(){
  v_uv=a_uv;
  float d=texture(u_depth,a_uv).r;
  float a0=texture(u_color,a_uv).a;
  if(u_edge_shrink>0.0){
    float e=u_edge_shrink;
    float d1=texture(u_depth,a_uv+vec2(e,0.0)).r;
    float d2=texture(u_depth,a_uv+vec2(-e,0.0)).r;
    float d3=texture(u_depth,a_uv+vec2(0.0,e)).r;
    float d4=texture(u_depth,a_uv+vec2(0.0,-e)).r;
    float a1=texture(u_color,a_uv+vec2(e,0.0)).a;
    float a2=texture(u_color,a_uv+vec2(-e,0.0)).a;
    float a3=texture(u_color,a_uv+vec2(0.0,e)).a;
    float a4=texture(u_color,a_uv+vec2(0.0,-e)).a;
    if(a0<0.5){
      float maxD=0.0;
      if(a1>=0.5)maxD=max(maxD,d1);
      if(a2>=0.5)maxD=max(maxD,d2);
      if(a3>=0.5)maxD=max(maxD,d3);
      if(a4>=0.5)maxD=max(maxD,d4);
      d=maxD;
    }
  }else{if(a0<0.5)d=0.0;}
  float x=((a_uv.x*2.0-1.0)+u_shift.x*(1.0-d))*u_aspect+u_offset.x;
  float y=-(a_uv.y*2.0-1.0)+u_shift.y*(1.0-d)+u_offset.y;
  float z=d*u_disp;
  gl_Position=u_mvp*vec4(x,y,z,1.0);
}\`;
const FS=\`#version 300 es
precision highp float;
in vec2 v_uv;
uniform sampler2D u_color;
out vec4 f;
void main(){
  vec4 col=texture(u_color,v_uv);
  if(col.a<0.5)discard;
  f=col;
}\`;

function cmpGL(gl,type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);return s;}
function mkTex(gl,img){const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,img);gl.generateMipmap(gl.TEXTURE_2D);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR_MIPMAP_LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);return t;}
function persp(fov,asp,n,f){const t=1/Math.tan(fov/2),d=f-n;return new Float32Array([t/asp,0,0,0,0,t,0,0,0,0,-(f+n)/d,-1,0,0,-2*f*n/d,0]);}
function rotY(a){const c=Math.cos(a),s=Math.sin(a);return new Float32Array([c,0,-s,0,0,1,0,0,s,0,c,0,0,0,0,1]);}
function transl(x,y,z){const m=new Float32Array(16);m[0]=m[5]=m[10]=m[15]=1;m[12]=x;m[13]=y;m[14]=z;return m;}
function mul(a,b){const o=new Float32Array(16);for(let c=0;c<4;c++)for(let r=0;r<4;r++)o[c*4+r]=a[r]*b[c*4]+a[4+r]*b[c*4+1]+a[8+r]*b[c*4+2]+a[12+r]*b[c*4+3];return o;}
function lrp(cur,tgt,base,dt){return cur+(tgt-cur)*(1-Math.pow(1-base,dt/16.667));}

function createCard(canvas,colorSrc,depthSrc,cfg){
  const gl=canvas.getContext('webgl2',{alpha:true,premultipliedAlpha:false});if(!gl)return null;
  const prog=gl.createProgram();
  gl.attachShader(prog,cmpGL(gl,gl.VERTEX_SHADER,VS));
  gl.attachShader(prog,cmpGL(gl,gl.FRAGMENT_SHADER,FS));
  gl.linkProgram(prog);gl.useProgram(prog);
  gl.enable(gl.DEPTH_TEST);gl.clearColor(0,0,0,0);
  const uMvp=gl.getUniformLocation(prog,'u_mvp');
  const uDisp=gl.getUniformLocation(prog,'u_disp');
  const uShift=gl.getUniformLocation(prog,'u_shift');
  const uAspect=gl.getUniformLocation(prog,'u_aspect');
  const uOffset=gl.getUniformLocation(prog,'u_offset');
  const uEdgeShrink=gl.getUniformLocation(prog,'u_edge_shrink');
  gl.uniform1i(gl.getUniformLocation(prog,'u_depth'),0);
  gl.uniform1i(gl.getUniformLocation(prog,'u_color'),1);
  gl.uniform1f(uEdgeShrink,cfg.edge||0);
  const N=Math.min(cfg.grid||200,250);
  const verts=new Float32Array((N+1)*(N+1)*2);let vi=0;
  for(let y=0;y<=N;y++)for(let x=0;x<=N;x++){verts[vi++]=x/N;verts[vi++]=y/N;}
  const ids=new Uint32Array(N*N*6);let ii=0;
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){const tl=y*(N+1)+x;ids[ii++]=tl;ids[ii++]=tl+1;ids[ii++]=tl+N+1;ids[ii++]=tl+1;ids[ii++]=tl+N+2;ids[ii++]=tl+N+1;}
  const vbo=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,vbo);gl.bufferData(gl.ARRAY_BUFFER,verts,gl.STATIC_DRAW);
  const ibo=gl.createBuffer();gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ibo);gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,ids,gl.STATIC_DRAW);
  const loc=gl.getAttribLocation(prog,'a_uv');
  let tC=null,tD=null,ready=0;
  const iC=new Image();iC.onload=()=>{tC=mkTex(gl,iC);if(++ready===2)draw(curRY);};iC.src=colorSrc;
  const iD=new Image();iD.onload=()=>{tD=mkTex(gl,iD);if(++ready===2)draw(curRY);};iD.src=depthSrc;
  const fov=(cfg.fov||55)*Math.PI/180,dist=cfg.dist||2.2,disp=cfg.depth||.4;
  const offx=cfg.offx||0,offy=cfg.offy||0;
  const imgAsp=cfg.imgW&&cfg.imgH?cfg.imgW/cfg.imgH:1;
  let raf=null,lastTs=0,curRY=0,tgtRY=0;
  function draw(ry){
    if(ready<2)return;
    const cW=canvas.width,cH=canvas.height,asp=cW/cH;
    const mvp=mul(mul(persp(fov,asp,.01,100),transl(0,0,-dist)),rotY(ry));
    gl.viewport(0,0,cW,cH);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
    gl.uniformMatrix4fv(uMvp,false,mvp);gl.uniform1f(uDisp,disp);
    gl.uniform2f(uShift,0,0);gl.uniform1f(uAspect,imgAsp);gl.uniform2f(uOffset,offx,offy);
    gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,tD);
    gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,tC);
    gl.bindBuffer(gl.ARRAY_BUFFER,vbo);gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ibo);
    gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,8,0);
    gl.drawElements(gl.TRIANGLES,ids.length,gl.UNSIGNED_INT,0);
  }
  function smoothLoop(ts){
    const dt=Math.min(ts-lastTs,100);lastTs=ts;
    curRY=lrp(curRY,tgtRY,0.12,dt);
    draw(curRY*Math.PI/180);
    if(Math.abs(curRY-tgtRY)>0.05)raf=requestAnimationFrame(smoothLoop);
    else{curRY=tgtRY;draw(curRY*Math.PI/180);raf=null;}
  }
  return{
    setOffset(offset,maxDeg=35){
      tgtRY=Math.max(-maxDeg,Math.min(maxDeg,-offset*maxDeg));
      if(!raf){lastTs=performance.now();raf=requestAnimationFrame(smoothLoop);}
    }
  };
}

const carousel=document.getElementById('carousel');
const ctrls=[];
CARDS.forEach(card=>{
  const el=document.createElement('div');
  el.className='card-3d';
  const bgStyle=card.bg?'background-image:url(\''+card.bg+'\');background-size:cover;background-position:center;':'';
  const fgHtml=card.fg?'<img src="'+card.fg+'" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;z-index:2;pointer-events:none;">':'';
  el.innerHTML=\`
    <div class="card-canvas-wrap" style="\${bgStyle}">
      <canvas width="520" height="760" style="position:relative;z-index:1;"></canvas>
      \${fgHtml}
      \${card.meta?.genre?'<div class="tag-genre">'+card.meta.genre+'</div>':''}
      \${card.meta?.rating?'<div class="tag-rating"><div class="rating-dot"></div>'+card.meta.rating+'</div>':''}
    </div>
    <div class="card-meta-below">
      <div class="card-meta-title">\${card.meta?.title||''}</div>
      <div class="card-meta-sub">\${[card.meta?.year,card.meta?.country].filter(Boolean).join(', ')}</div>
    </div>\`;
  carousel.appendChild(el);
  ctrls.push(createCard(el.querySelector('canvas'),card.color,card.depth,card.cfg));
});

const MAX_DEG=${maxDeg};
const MAX_BLUR=${maxBlur};
const USE_SCALE=${useScale};
function updateAngles(){
  const viewCx=carousel.scrollLeft+carousel.clientWidth/2;
  const els=[...carousel.querySelectorAll('.card-3d')];
  els.forEach((el,i)=>{
    const offset=(el.offsetLeft+el.offsetWidth/2-viewCx)/el.offsetWidth;
    const clamped=Math.max(-1.5,Math.min(1.5,offset));
    const prox=Math.max(0,1-Math.abs(clamped)*0.5);
    el.style.transform='scale('+(USE_SCALE?0.88+prox*0.12:1)+')';
    el.style.opacity=0.45+prox*0.55;
    const blurPx=MAX_BLUR*(1-prox);
    el.querySelector('canvas').style.filter=blurPx>0.1?'blur('+blurPx.toFixed(1)+'px)':'';
    ctrls[i]&&ctrls[i].setOffset(clamped,MAX_DEG);
  });
}
carousel.addEventListener('scroll',updateAngles,{passive:true});
setTimeout(updateAngles,200);
<\/script>
</body>
</html>`;
}
</script>
</body>
</html>
